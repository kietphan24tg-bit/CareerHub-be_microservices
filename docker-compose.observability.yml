services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: careerhub-prometheus
    command:
      - /bin/sh
      - -c
      - >-
        sed
        -e "s|__CLOUDAMQP_PROMETHEUS_SCHEME__|$${CLOUDAMQP_PROMETHEUS_SCHEME}|g"
        -e "s|__CLOUDAMQP_PROMETHEUS_PATH__|$${CLOUDAMQP_PROMETHEUS_PATH}|g"
        -e "s|__CLOUDAMQP_PROMETHEUS_USERNAME__|$${CLOUDAMQP_PROMETHEUS_USERNAME}|g"
        -e "s|__CLOUDAMQP_PROMETHEUS_PASSWORD__|$${CLOUDAMQP_PROMETHEUS_PASSWORD}|g"
        -e "s|__CLOUDAMQP_PROMETHEUS_TARGET__|$${CLOUDAMQP_PROMETHEUS_TARGET}|g"
        /etc/prometheus/prometheus.tpl.yml > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml
    environment:
      CLOUDAMQP_PROMETHEUS_SCHEME: ${CLOUDAMQP_PROMETHEUS_SCHEME:-https}
      CLOUDAMQP_PROMETHEUS_PATH: ${CLOUDAMQP_PROMETHEUS_PATH:-/metrics/detailed}
      CLOUDAMQP_PROMETHEUS_USERNAME: ${CLOUDAMQP_PROMETHEUS_USERNAME:-}
      CLOUDAMQP_PROMETHEUS_PASSWORD: ${CLOUDAMQP_PROMETHEUS_PASSWORD:-}
      CLOUDAMQP_PROMETHEUS_TARGET: ${CLOUDAMQP_PROMETHEUS_TARGET:-}
    ports:
      - '9092:9090'
    restart: unless-stopped
    networks:
      - careerhub
    volumes:
      - ./infrastructure/observability/stack/prometheus/prometheus.cloudamqp.yml.template:/etc/prometheus/prometheus.tpl.yml:ro

  loki:
    image: grafana/loki:3.5.3
    container_name: careerhub-loki
    command:
      - '-config.file=/etc/loki/config.yml'
    ports:
      - '3100:3100'
    restart: unless-stopped
    networks:
      - careerhub
    volumes:
      - ./infrastructure/observability/stack/loki/loki-config.yml:/etc/loki/config.yml:ro

  promtail:
    image: grafana/promtail:3.5.3
    container_name: careerhub-promtail
    command:
      - '-config.file=/etc/promtail/config.yml'
    restart: unless-stopped
    networks:
      - careerhub
    volumes:
      - ./infrastructure/observability/stack/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./tmp/logs:/var/log/careerhub:ro

  tempo:
    image: grafana/tempo:2.8.2
    container_name: careerhub-tempo
    command:
      - '-config.file=/etc/tempo/config.yml'
    ports:
      - '3200:3200'
      - '4317:4317'
      - '4318:4318'
    restart: unless-stopped
    networks:
      - careerhub
    volumes:
      - ./infrastructure/observability/stack/tempo/tempo.yml:/etc/tempo/config.yml:ro

  grafana:
    image: grafana/grafana:12.0.2
    container_name: careerhub-grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: '${GF_SMTP_HOST}'
      GF_SMTP_USER: '${GF_SMTP_USER}'
      GF_SMTP_PASSWORD: '${GF_SMTP_PASSWORD}'
      GF_SMTP_FROM_ADDRESS: '${GF_SMTP_FROM_ADDRESS}'
      GF_SMTP_FROM_NAME: 'CareerHub Alerts'
      GF_UNIFIED_ALERTING_ENABLED: 'true'
      GF_ALERT_EMAIL_TO: '${GF_ALERT_EMAIL_TO}'
    ports:
      - '3300:3000'
    restart: unless-stopped
    networks:
      - careerhub
    volumes:
      - ./infrastructure/observability/stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/stack/grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  careerhub:
    external: true
    name: careerhub-network
