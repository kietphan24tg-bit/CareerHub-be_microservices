name: Release - Validate and Publish Images

# NOTE: This workflow is the current CD boundary for main.
# It validates the monorepo, then publishes Docker images to Docker Hub
# (docker.io). It does NOT deploy services to a runtime environment.
# Database migrations and runtime rollout remain separate deploy-time steps.

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: kietphan24/careerhub

jobs:
  install_and_build_packages:
    name: Install and build shared packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

  typecheck_services:
    name: Type-check all services
    runs-on: ubuntu-latest
    needs: install_and_build_packages

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Type-check gateway
        run: pnpm --filter @careerhub/gateway build

      - name: Type-check iam-service
        run: |
          pnpm --filter @careerhub/iam-service run prisma:generate
          pnpm --filter @careerhub/iam-service build

      - name: Type-check application-service
        run: |
          pnpm --filter @careerhub/application-service run prisma:generate
          pnpm --filter @careerhub/application-service build

      - name: Type-check candidate-service
        run: |
          pnpm --filter @careerhub/candidate-service run prisma:generate
          pnpm --filter @careerhub/candidate-service build

      - name: Type-check employer-service
        run: |
          pnpm --filter @careerhub/employer-service run prisma:generate
          pnpm --filter @careerhub/employer-service build

      - name: Type-check job-service
        run: |
          pnpm --filter @careerhub/job-service run prisma:generate
          pnpm --filter @careerhub/job-service build

      - name: Type-check communication-service
        run: |
          pnpm --filter @careerhub/communication-service run prisma:generate
          pnpm --filter @careerhub/communication-service build

      - name: Type-check workflow-service
        run: |
          pnpm --filter @careerhub/workflow-service run prisma:generate
          pnpm --filter @careerhub/workflow-service build

  unit_tests_core:
    name: Run portable core service tests
    runs-on: ubuntu-latest
    needs: install_and_build_packages

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Run core unit tests
        run: pnpm test:core

  smoke_tests:
    name: Run core smoke tests
    runs-on: ubuntu-latest
    needs:
      - typecheck_services
      - unit_tests_core

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Run smoke tests
        run: pnpm test:smoke:core

  publish_images:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: smoke_tests

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            port: 3000
          - service: iam-service
            port: 3001
          - service: candidate-service
            port: 3002
          - service: employer-service
            port: 3003
          - service: job-service
            port: 3004
          - service: application-service
            port: 3005
          - service: communication-service
            port: 3006
          - service: workflow-service
            port: 3007

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# After publishing images, run database migrations as a separate deploy-time step.
# The root helper command is:
#
#   pnpm prisma:migrate:deploy:all
#
# This must run with DIRECT_URL (not pooled) to avoid PgBouncer DDL issues.
# See docs/production-env-guide.md for the full migration command list.
