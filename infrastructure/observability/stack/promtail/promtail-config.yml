server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: careerhub-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/careerhub/*.jsonl
          job: careerhub
    pipeline_stages:
      - json:
          expressions:
            context: context
            level: level
            requestId: requestId
            service: service
            spanId: spanId
            traceId: traceId
      - labels:
          context:
          level:
          service:
