global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts/careerhub-observability.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - grafana:3000
      api_version: v2
      path_prefix: /

scrape_configs:
  - job_name: careerhub-prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: careerhub-prometheus
          group: infrastructure

  - job_name: careerhub-loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: careerhub-loki
          group: infrastructure

  - job_name: careerhub-tempo
    static_configs:
      - targets:
          - tempo:3200
        labels:
          service: careerhub-tempo
          group: infrastructure

  - job_name: careerhub-rabbitmq
    scheme: __CLOUDAMQP_PROMETHEUS_SCHEME__
    metrics_path: __CLOUDAMQP_PROMETHEUS_PATH__
    basic_auth:
      username: "__CLOUDAMQP_PROMETHEUS_USERNAME__"
      password: "__CLOUDAMQP_PROMETHEUS_PASSWORD__"
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - __CLOUDAMQP_PROMETHEUS_TARGET__
        labels:
          service: careerhub-rabbitmq
          group: infrastructure

  - job_name: careerhub-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3000
        labels:
          service: careerhub-gateway
          group: application

  - job_name: careerhub-iam-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - iam-service:3001
        labels:
          service: careerhub-iam-service
          group: application

  - job_name: careerhub-candidate-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - candidate-service:3002
        labels:
          service: careerhub-candidate-service
          group: application

  - job_name: careerhub-employer-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - employer-service:3003
        labels:
          service: careerhub-employer-service
          group: application

  - job_name: careerhub-job-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - job-service:3004
        labels:
          service: careerhub-job-service
          group: application

  - job_name: careerhub-application-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - application-service:3005
        labels:
          service: careerhub-application-service
          group: application

  - job_name: careerhub-communication-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - communication-service:3006
        labels:
          service: careerhub-communication-service
          group: application
