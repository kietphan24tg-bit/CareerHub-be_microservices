global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts/careerhub-observability.rules.yml

scrape_configs:
  - job_name: careerhub-prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: careerhub-prometheus
          group: infrastructure

  - job_name: careerhub-loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: careerhub-loki
          group: infrastructure

  - job_name: careerhub-tempo
    static_configs:
      - targets:
          - tempo:3200
        labels:
          service: careerhub-tempo
          group: infrastructure

  - job_name: careerhub-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: careerhub-gateway
          group: application

  - job_name: careerhub-iam-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001
        labels:
          service: careerhub-iam-service
          group: application

  - job_name: careerhub-candidate-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3002
        labels:
          service: careerhub-candidate-service
          group: application

  - job_name: careerhub-employer-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3003
        labels:
          service: careerhub-employer-service
          group: application
