groups:
  - name: careerhub-outbox
    rules:
      - alert: CareerHubOutboxFailedBacklog
        expr: max by (service) (careerhub_outbox_backlog{status="failed"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox failed backlog detected for {{ $labels.service }}"
          description: "The service has failed outbox records waiting for operator attention."

      - alert: CareerHubOutboxOldestPendingAgeHigh
        expr: max by (service) (careerhub_outbox_oldest_pending_age_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox pending age is high for {{ $labels.service }}"
          description: "The oldest pending outbox record is older than 60 seconds."

  - name: careerhub-integration-consumers
    rules:
      - alert: CareerHubRabbitMqConsumerErrors
        expr: sum by (service, queue) (increase(careerhub_rmq_errors_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ consumer errors detected for {{ $labels.service }}"
          description: "The service reported RabbitMQ consumer errors in the last five minutes."

      - alert: CareerHubIntegrationConsumerDuplicateSpike
        expr: sum by (service, consumer, event_name) (increase(careerhub_integration_consumer_total{status="duplicate"}[10m])) > 5
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Duplicate integration deliveries increased for {{ $labels.service }}"
          description: "The consumer is skipping more than five duplicate deliveries in ten minutes."

      - alert: CareerHubIntegrationConsumerDeadLettered
        expr: sum by (service, consumer) (increase(careerhub_integration_consumer_total{status="dead_lettered"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Integration consumer dead-lettered messages for {{ $labels.service }}"
          description: "One or more valid messages were parked to DLQ in the last five minutes. Inspect logs by messageId/sourceEventId before replay."

      - alert: CareerHubIntegrationConsumerDeadLetteredSustained
        expr: sum by (service, consumer) (increase(careerhub_integration_consumer_total{status="dead_lettered"}[15m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained dead-letter activity for {{ $labels.service }}"
          description: "More than three messages dead-lettered in fifteen minutes. Fix root cause before bulk DLQ replay."

  - name: careerhub-rabbitmq-dlq
    rules:
      - alert: CareerHubRabbitMqDlqBacklogDetected
        expr: max by (queue, vhost) ((rabbitmq_detailed_queue_messages{queue=~".*dlq\\.(application\\.dashboard-cache-invalidation|communication\\.notifications|iam\\.password-reset-mail|job\\.search-index|job\\.slug-cache-invalidation)$"}) or (lavinmq_detailed_queue_messages{queue=~".*dlq\\.(application\\.dashboard-cache-invalidation|communication\\.notifications|iam\\.password-reset-mail|job\\.search-index|job\\.slug-cache-invalidation)$"})) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ backlog detected on {{ $labels.queue }}"
          description: "RabbitMQ reports one or more parked messages in {{ $labels.queue }} for at least five minutes. Inspect the DLQ, identify root cause, then replay after the fix."
