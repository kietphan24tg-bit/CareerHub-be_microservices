syntax = "proto3";

package careerhub.employer.v1;

service EmployerService {
  rpc CreateEmployerProfile (CreateEmployerProfileRequest) returns (CreateEmployerProfileResponse);
  rpc DeleteEmployerProfileCompensation (DeleteEmployerProfileCompensationRequest) returns (DeleteEmployerProfileCompensationResponse);
  rpc GetEmployerProfileByIdentityId (GetEmployerProfileByIdentityIdRequest) returns (GetEmployerProfileByIdentityIdResponse);
  rpc UpdateEmployerProfile (UpdateEmployerProfileRequest) returns (UpdateEmployerProfileResponse);

  rpc CreateDepartment (CreateDepartmentRequest) returns (DepartmentResponse);
  rpc UpdateDepartment (UpdateDepartmentRequest) returns (DepartmentResponse);
  rpc DeleteDepartment (DeleteDepartmentRequest) returns (DeleteDepartmentResponse);
  rpc ListDepartmentsByCompany (ListDepartmentsByCompanyRequest) returns (ListDepartmentsByCompanyResponse);
}

message CreateEmployerProfileRequest {
  string identity_id = 1;
  string company_name = 2;
  string contact_name = 3;
  string contact_phone = 4;
  string industry = 5;
  string address = 6;
  string request_id = 7;
}

message CreateEmployerProfileResponse {
  string profile_id = 1;
  string identity_id = 2;
}

message DeleteEmployerProfileCompensationRequest {
  string identity_id = 1;
  string request_id = 2;
}

message DeleteEmployerProfileCompensationResponse {
  bool compensated = 1;
}

message GetEmployerProfileByIdentityIdRequest {
  string identity_id = 1;
  string request_id = 2;
}

message EmployerProfile {
  string id = 1;
  string identity_id = 2;
  string company_name = 3;
  string logo_url = 4;
  string website = 5;
  string industry = 6;
  string company_size = 7;
  int32 founded_year = 8;
  string description = 9;
  string address = 10;
  string tax_code = 11;
  string contact_name = 12;
  string contact_phone = 13;
  string created_at = 14;
  string updated_at = 15;
  repeated string null_fields = 16;
}

message GetEmployerProfileByIdentityIdResponse {
  EmployerProfile profile = 1;
}

message UpdateEmployerProfileRequest {
  string identity_id = 1;
  string request_id = 2;
  repeated string updated_fields = 3;
  repeated string clear_fields = 4;
  string company_name = 5;
  string logo_url = 6;
  string website = 7;
  string industry = 8;
  string company_size = 9;
  int32 founded_year = 10;
  string description = 11;
  string address = 12;
  string tax_code = 13;
  string contact_name = 14;
  string contact_phone = 15;
}

message UpdateEmployerProfileResponse {
  EmployerProfile profile = 1;
}

// Department messages
message Department {
  string id = 1;
  string company_id = 2;
  string name = 3;
  string description = 4;
  repeated string null_fields = 5;
  string created_at = 6;
  string updated_at = 7;
}

message CreateDepartmentRequest {
  string identity_id = 1;
  string name = 2;
  string description = 3;
  string request_id = 4;
}

message UpdateDepartmentRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string updated_fields = 4;
  repeated string clear_fields = 5;
  string request_id = 6;
}

message DeleteDepartmentRequest {
  string id = 1;
  string request_id = 2;
}

message DeleteDepartmentResponse {
  bool deleted = 1;
}

message DepartmentResponse {
  Department department = 1;
}

message ListDepartmentsByCompanyRequest {
  string identity_id = 1;
  string request_id = 2;
}

message ListDepartmentsByCompanyResponse {
  repeated Department departments = 1;
}
