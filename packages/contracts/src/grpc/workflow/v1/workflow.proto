syntax = "proto3";

package careerhub.workflow.v1;

service WorkflowService {
  rpc RegisterCandidate (RegisterCandidateRequest) returns (RegistrationSagaResponse);
  rpc RegisterEmployer (RegisterEmployerRequest) returns (RegistrationSagaResponse);
}

message RegisterCandidateRequest {
  string email = 1;
  string password = 2;
  bool accept_terms = 3;
  string full_name = 4;
  string phone = 5;
  string request_id = 6;
}

message RegisterEmployerRequest {
  string company_email = 1;
  string password = 2;
  bool accept_terms = 3;
  string company_name = 4;
  string full_name = 5;
  string phone = 6;
  string industry = 7;
  string address = 8;
  string request_id = 9;
}

message RegistrationSagaResponse {
  string saga_id = 1;
  string identity_id = 2;
  string email = 3;
  string role = 4;
  string status = 5;
}
