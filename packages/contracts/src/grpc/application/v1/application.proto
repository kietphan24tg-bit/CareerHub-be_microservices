syntax = "proto3";

package careerhub.application.v1;

service ApplicationService {
  rpc ApplyToJob (ApplyToJobRequest) returns (ApplyToJobResponse);
  rpc WithdrawApplication (WithdrawApplicationRequest) returns (WithdrawApplicationResponse);
  rpc UpdateApplicationStatus (UpdateApplicationStatusRequest) returns (UpdateApplicationStatusResponse);
  rpc ListCandidateApplications (ListCandidateApplicationsRequest) returns (ListCandidateApplicationsResponse);
  rpc GetCandidateApplicationById (GetCandidateApplicationByIdRequest) returns (GetCandidateApplicationByIdResponse);
  rpc ListJobApplications (ListJobApplicationsRequest) returns (ListJobApplicationsResponse);
  rpc GetEmployerApplicationById (GetEmployerApplicationByIdRequest) returns (GetEmployerApplicationByIdResponse);
  rpc GetApplicationHistory (GetApplicationHistoryRequest) returns (GetApplicationHistoryResponse);
  rpc GetApplicationCountsByJobIds (GetApplicationCountsByJobIdsRequest) returns (GetApplicationCountsByJobIdsResponse);
  rpc ListEmployerInterviews (ListEmployerInterviewsRequest) returns (ListEmployerInterviewsResponse);
  rpc CreateInterview (CreateInterviewRequest) returns (CreateInterviewResponse);
  rpc UpdateInterview (UpdateInterviewRequest) returns (UpdateInterviewResponse);
  rpc CancelInterview (CancelInterviewRequest) returns (CancelInterviewResponse);
  rpc GetCandidateInterview (GetCandidateInterviewRequest) returns (GetCandidateInterviewResponse);
  rpc ConfirmInterview (ConfirmInterviewRequest) returns (ConfirmInterviewResponse);
  rpc DeclineInterview (DeclineInterviewRequest) returns (DeclineInterviewResponse);
  rpc RequestInterviewReschedule (RequestInterviewRescheduleRequest) returns (RequestInterviewRescheduleResponse);
  rpc ListBenefitCatalog (ListBenefitCatalogRequest) returns (ListBenefitCatalogResponse);
  rpc CreateOffer (CreateOfferRequest) returns (CreateOfferResponse);
  rpc SendOffer (SendOfferRequest) returns (SendOfferResponse);
  rpc UpdateOffer (UpdateOfferRequest) returns (UpdateOfferResponse);
  rpc SoftDeleteOffer (SoftDeleteOfferRequest) returns (SoftDeleteOfferResponse);
  rpc ListEmployerOffersForApplication (ListEmployerOffersForApplicationRequest) returns (ListEmployerOffersForApplicationResponse);
  rpc GetEmployerOffer (GetEmployerOfferRequest) returns (GetEmployerOfferResponse);
  rpc ListCandidateOffersForApplication (ListCandidateOffersForApplicationRequest) returns (ListCandidateOffersForApplicationResponse);
  rpc GetCandidateOffer (GetCandidateOfferRequest) returns (GetCandidateOfferResponse);
  rpc AcceptOffer (AcceptOfferRequest) returns (AcceptOfferResponse);
  rpc DeclineOffer (DeclineOfferRequest) returns (DeclineOfferResponse);
  rpc GetEmployerDashboardRecruitmentData (GetEmployerDashboardRecruitmentDataRequest) returns (GetEmployerDashboardRecruitmentDataResponse);
  rpc GetCandidateDashboardData (GetCandidateDashboardDataRequest) returns (GetCandidateDashboardDataResponse);
  rpc ListRecruiterNotes (ListRecruiterNotesRequest) returns (ListRecruiterNotesResponse);
  rpc CreateRecruiterNote (CreateRecruiterNoteRequest) returns (CreateRecruiterNoteResponse);
  rpc UpdateRecruiterNote (UpdateRecruiterNoteRequest) returns (UpdateRecruiterNoteResponse);
  rpc DeleteRecruiterNote (DeleteRecruiterNoteRequest) returns (DeleteRecruiterNoteResponse);
}

message PageMeta {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
}

